<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html" class="active">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html">Cart <span id="cart-count"></span></a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Everyday tech, honest prices.</h2>
      <p>Laptops, phones and accessories delivered across the UAE.</p>
      <a class="cta" href="products.html">Shop all products</a>
    </section>

    <h2 class="section-title">Featured products</h2>
    <section class="product-grid" id="featured-products">
      <div class="product">
        <img src="images/laptop.jpg" alt="Business Laptop">
        <h3>Business Laptop</h3>
        <p>AED 3,499</p>
        <button onclick="addToCartById(1, this)">Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/smartphone.jpg" alt="Smartphone X">
        <h3>Smartphone X</h3>
        <p>AED 2,499</p>
        <button disabled>Out of Stock</button>
      </div>
      <div class="product">
        <img src="images/headphones.jpg" alt="Noise-Cancelling Headphones">
        <h3>Noise-Cancelling Headphones</h3>
        <p>AED 599</p>
        <button onclick="addToCartById(11, this)">Add to Cart</button>
      </div>
    </section>
  </main>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>
  <!-- Lab 4/5: Supabase library + keys first, then cart and auth, then the page script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
