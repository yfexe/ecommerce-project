<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h2 class="section-title">All products</h2>

    <section class="controls">
      <input type="text" id="search-box" placeholder="Search products..." aria-label="Search products">

      <div class="category-buttons">
        <button class="category-btn active" data-category="All">All</button>
        <button class="category-btn" data-category="Computers">Computers</button>
        <button class="category-btn" data-category="Accessories">Accessories</button>
        <button class="category-btn" data-category="Phones">Phones</button>
      </div>

      <select id="sort-select" aria-label="Sort products">
        <option value="default">Sort: Default</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
      </select>
    </section>

    <p id="result-count" class="result-count"></p>
    <div id="product-list" class="product-grid"></div>
  </main>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
