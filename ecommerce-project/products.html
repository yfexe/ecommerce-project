<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h2 class="section-title">All products</h2>
    <section class="product-grid">
      <div class="product">
        <img src="images/laptop.jpg" alt="Business Laptop">
        <h3>Business Laptop</h3>
        <p>AED 3,499</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/mouse.jpg" alt="Wireless Mouse">
        <h3>Wireless Mouse</h3>
        <p>AED 129</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/smartphone.jpg" alt="Smartphone X">
        <h3>Smartphone X</h3>
        <p>AED 2,499</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/headphones.jpg" alt="Noise-Cancelling Headphones">
        <h3>Noise-Cancelling Headphones</h3>
        <p>AED 599</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/keyboard.jpg" alt="Mechanical Keyboard">
        <h3>Mechanical Keyboard</h3>
        <p>AED 349</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/monitor.jpg" alt="27-inch Monitor">
        <h3>27-inch Monitor</h3>
        <p>AED 1,199</p>
        <button>Add to Cart</button>
      </div>
    </section>
  </main>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
